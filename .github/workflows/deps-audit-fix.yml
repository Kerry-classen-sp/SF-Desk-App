# Temporary: npm audit fix on package-lock.json from a runner that can reach the npm registry (the SailPoint
# network can't). Runs on pushes to deps/* branches; removed before the branch is merged.
name: npm audit fix (lockfile)
on:
  push:
    branches: ['deps/**']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit before
        run: npm audit --omit=dev || true
      - name: Fix the lockfile (no --force, so no major upgrades)
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Audit after
        run: npm audit --omit=dev || true
      - name: Versions
        run: npm ls body-parser qs express dotenv --package-lock-only --all || true
      - name: Packages for the lockfile
        run: npm ci --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 3
      - name: Commit the lockfile
        run: |
          git diff --quiet package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "npm audit fix: package-lock.json" package-lock.json
          git push
