# The iPad app's Xcode project, for XcodeGen (brew install xcodegen):
#   cd ios && xcodegen && open SFDesk.xcodeproj
# The .xcodeproj is generated, not kept in git; this file is the source.
name: SFDesk
options:
  bundleIdPrefix: com.sailpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.7.5"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L2A875NLGY
    CODE_SIGN_STYLE: Automatic
targets:
  SFDesk:
    type: application
    platform: iOS
    sources:
      - path: SFDesk/App
      - path: SFDesk/Host
        excludes: ["host.js"]
      - path: SFDesk/Assets.xcassets
      - path: SFDesk/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Made by build-core.sh (the first build step), so they're folder references, read at build time.
      - path: SFDesk/Generated/web
        type: folder
        buildPhase: resources
        optional: true
      - path: SFDesk/Generated/core-bundle.js
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Bundle the shared core and the page
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          "$SRCROOT/build-core.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: SF Desk
        PRODUCT_BUNDLE_IDENTIFIER: com.sailpoint.sfdesk
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: SFDesk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
