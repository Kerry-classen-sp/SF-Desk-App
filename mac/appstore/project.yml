# The native Mac app (mac/app) as a sandboxed App Store build, for TestFlight, for XcodeGen:
#   mac/appstore/testflight.sh       archive and upload
# The .xcodeproj is generated, not kept in git; this file is the source. The server, its node_modules and
# Node.js come from dist/SF Desk.app (scripts/build-mac-app.sh), signed into the app by embed-server.sh.
name: SFDeskMac
options:
  bundleIdPrefix: com.sailpoint
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L2A875NLGY
    CODE_SIGN_STYLE: Automatic
targets:
  SFDeskMac:
    type: application
    platform: macOS
    sources:
      - path: ../app/SFDesk.swift
    postBuildScripts:
      - name: Embed and sign the server and Node.js
        script: |
          "$SRCROOT/embed-server.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: SF Desk
        PRODUCT_BUNDLE_IDENTIFIER: com.sailpoint.sfdesk
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SFDesk.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_SWIFT_FLAGS: -parse-as-library
